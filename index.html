      color: #222;
      min-height: 100vh;
      position: relative;
    }

    body::before {

      top: 55%;
      transform: translate(-50%, -50%) rotate(-25deg);
      font-size: 130px;
      font-weight: 900;
      letter-spacing: 15px;
      color: rgba(0, 0, 0, 0.035);
      z-index: 0;
      pointer-events: none;
      white-space: nowrap;

    .cabecalho {
      position: relative;
      z-index: 2;
      width: 100%;
      min-height: 90px;
      background: white;
      border-bottom: 4px solid #0b5cab;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);

    .titulo {

      flex: 1;
    }

    .titulo h1 {
      margin: 0;
      font-size: 23px;
      color: #17324d;
    }

    .pagina {
      position: relative;
      z-index: 1;
      padding: 30px 15px 50px;
    }

    .formulario {
      max-width: 650px;
      margin: auto;
      background: rgba(255, 255, 255, 0.97);
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.15);
    }

    .campo {
      display: flex;
      flex-direction: column;
      margin-bottom: 18px;
    }

    label {
      font-weight: bold;
      margin-bottom: 7px;
      color: #17324d;
    }

    select,
    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #b8c1ca;
      border-radius: 7px;
      font-size: 16px;
      background: white;
      outline: none;
    }

    select:focus,
    input:focus,
    textarea:focus {
      border-color: #0b5cab;
      box-shadow: 0 0 0 2px rgba(11,92,171,0.12);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 7px;
      background: #0b5cab;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #083f76;
    }

    button:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    .observacao-maquina {
      margin-bottom: 8px;
      padding: 10px;
      background: #f1f5f9;
      border-radius: 6px;
      font-size: 13px;
      color: #555;
    }

    #resultado {
      margin-top: 20px;
      padding: 15px;
      background: #f7f7f7;
      border-radius: 8px;
      white-space: pre-wrap;
      display: none;
      font-family: Arial, sans-serif;
    }

    @media (max-width: 700px) {

        padding: 20px;
      }

      }

  <script>

    // =========================================================
    // URL DE PRODUÇÃO DO WEBHOOK DO N8N
    // =========================================================

    const URL_API = "https://n8n-phjm.srv1897202.hstgr.cloud/webhook/ae21136a-b196-4086-8958-6038117ea9e1";


    // =========================================================
    // DATA AUTOMÁTICA
    // =========================================================

    const campoData = document.getElementById("data");

    const hoje = new Date();
    const ano = hoje.getFullYear();
    const mes = String(hoje.getMonth() + 1).padStart(2, "0");
    const dia = String(hoje.getDate()).padStart(2, "0");

    campoData.value = `${ano}-${mes}-${dia}`;


    // =========================================================
    // GERA O RELATÓRIO
    // =========================================================

    function gerarRelatorio() {

      const responsavel =
        document.getElementById("responsavel").value;

      const turno =
        document.getElementById("turno").value;

      const dataOriginal =
        document.getElementById("data").value;

      const maquina =
        document.getElementById("maquina").value;

      const horimetro =
        document.getElementById("horimetro").value || "-";

      const tipoLavagem =
        document.getElementById("tipoLavagem").value;

      const inicio =
        document.getElementById("inicio").value;

      const termino =
        document.getElementById("termino").value;

      const ordem =
        document.getElementById("ordem").value;

      const observacao =
        document.getElementById("observacao").value || "-";


      let data = "-";

      if (dataOriginal) {

        const partes = dataOriginal.split("-");

        data =
          `${partes[2]}/${partes[1]}/${partes[0]}`;
      }


      const relatorio =
`*CENTRAL DE LAVAGEM DE EQUIPAMENTOS*

*Responsável BRATEC:* ${responsavel}
*Turno:* ${turno}
*Data:* ${data}
*Máquina:* ${maquina}
*Horímetro:* ${horimetro}
*Tipo de Lavagem:* ${tipoLavagem}
*Início:* ${inicio}
*Término:* ${termino}
*Ordem:* ${ordem}
*Observação:* ${observacao}`;


      const resultado =
        document.getElementById("resultado");

      resultado.textContent = relatorio;
      resultado.style.display = "block";


      return {
        responsavel,
        turno,
        data,
        maquina,
        horimetro,
        tipoLavagem,
        inicio,
        termino,
        ordem,
        observacao,
        relatorio
      };
    }


    // =========================================================
    // ENVIA PARA O N8N
    // =========================================================

    async function enviarFormulario(dados) {

      const corpo = new URLSearchParams();

      corpo.append(
        "payload",
        JSON.stringify(dados)
      );


      try {

        const resposta = await fetch(URL_API, {
          method: "POST",
          body: corpo
        });


        const texto = await resposta.text();

        console.log(
          "Resposta do N8N:",
          texto
        );


        return resposta.ok;


      } catch (erro) {

        console.error(
          "Erro ao enviar para o N8N:",
          erro
        );

        return false;
      }
    }


    // =========================================================
    // ENVIO DO FORMULÁRIO
    // =========================================================

    document
      .getElementById("formLavagem")
      .addEventListener(
        "submit",
        async function(event) {

          event.preventDefault();


          const camposObrigatorios =
            this.querySelectorAll("[required]");


          let tudoCerto = true;


          camposObrigatorios.forEach(
            function(campo) {

              if (!campo.value.trim()) {

                tudoCerto = false;

                campo.style.border =
                  "2px solid red";

              } else {

                campo.style.border = "";
              }

            }
          );


          if (!tudoCerto) {

            alert(
              "Preencha todos os campos obrigatórios."
            );

            return;
          }


          const botao =
            this.querySelector("button");


          botao.disabled = true;

          botao.textContent =
            "ENVIANDO...";


          const dados =
            gerarRelatorio();


          const enviado =
            await enviarFormulario(dados);


          if (enviado) {

            navigator.clipboard
              .writeText(dados.relatorio)
              .catch(() => {});


            alert(
              "Relatório enviado com sucesso para o N8N!"
            );


          } else {

            alert(
              "Não foi possível enviar o relatório. Verifique o N8N."
            );
          }


          botao.disabled = false;

          botao.textContent =
            "ENVIAR";

        }
      );
