<script>

const URL_API = "https://n8n-phjm.srv1897202.hstgr.cloud/webhook/ae2f136a-b196-4086-8958-6038117ea9e1";

const campoData = document.getElementById("data");

const hoje = new Date();
const ano = hoje.getFullYear();
const mes = String(hoje.getMonth() + 1).padStart(2, "0");
const dia = String(hoje.getDate()).padStart(2, "0");

campoData.value = `${ano}-${mes}-${dia}`;

function gerarRelatorio() {

  const responsavel = document.getElementById("responsavel").value;
  const turno = document.getElementById("turno").value;
  const dataOriginal = document.getElementById("data").value;
  const maquina = document.getElementById("maquina").value;
  const horimetro = document.getElementById("horimetro").value || "-";
  const tipoLavagem = document.getElementById("tipoLavagem").value;
  const inicio = document.getElementById("inicio").value;
  const termino = document.getElementById("termino").value;
  const ordem = document.getElementById("ordem").value;
  const observacao = document.getElementById("observacao").value || "-";

  let data = "-";

  if (dataOriginal) {
    const partes = dataOriginal.split("-");
    data = `${partes[2]}/${partes[1]}/${partes[0]}`;
  }

  const relatorio =
`*CENTRAL DE LAVAGEM DE EQUIPAMENTOS*

*Responsável BRATEC:* ${responsavel}
*Turno:* ${turno}
*Data:* ${data}
*Máquina:* ${maquina}
*Horímetro:* ${horimetro}
*Tipo de Lavagem:* ${tipoLavagem}
*Início:* ${inicio}
*Término:* ${termino}
*Ordem:* ${ordem}
*Observação:* ${observacao}`;

  document.getElementById("resultado").textContent = relatorio;
  document.getElementById("resultado").style.display = "block";

  return {
    responsavel,
    turno,
    data,
    maquina,
    horimetro,
    tipoLavagem,
    inicio,
    termino,
    ordem,
    observacao,
    relatorio
  };
}

async function enviarFormulario(dados) {

  try {

    const resposta = await fetch(URL_API, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(dados)
    });

    if (!resposta.ok) {
      throw new Error(`HTTP ${resposta.status}`);
    }

    const texto = await resposta.text();

    console.log("Resposta do N8N:", texto);

    return true;

  } catch (erro) {

    console.error("Erro ao enviar para o N8N:", erro);

    return false;
  }
}

document
  .getElementById("formLavagem")
  .addEventListener("submit", async function(event) {

    event.preventDefault();

    const camposObrigatorios = this.querySelectorAll("[required]");

    let tudoCerto = true;

    camposObrigatorios.forEach(function(campo) {

      if (!campo.value.trim()) {
        tudoCerto = false;
        campo.style.border = "2px solid red";
      } else {
        campo.style.border = "";
      }

    });

    if (!tudoCerto) {
      alert("Preencha todos os campos obrigatórios.");
      return;
    }

    const botao = this.querySelector("button");

    botao.disabled = true;
    botao.textContent = "ENVIANDO...";

    const dados = gerarRelatorio();

    const enviado = await enviarFormulario(dados);

    if (enviado) {

      navigator.clipboard
        .writeText(dados.relatorio)
        .catch(() => {});

      alert("Relatório enviado com sucesso para o N8N!");

    } else {

      alert("Não foi possível enviar o relatório. Verifique o N8N.");
    }

    botao.disabled = false;
    botao.textContent = "ENVIAR";

  });

</script>
